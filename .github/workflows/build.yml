name: Build

on:
  push:
  pull_request:

# 强制使用 Node.js 24（减少警告，不影响功能）
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # ✅ 新版用法：仅配置 Gradle（无任何参数）
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # ✅ 单独执行构建命令（修复 arguments 废弃报错）
      - name: Build with Gradle
        run: ./gradlew build
